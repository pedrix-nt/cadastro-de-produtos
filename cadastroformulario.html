<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Produtos</title>
</head>
<body>

    <h1>Cadastro de Produtos</h1>

    <form>
        <label for="nome">Nome do produto:</label>
        <input type="text" id="nome" placeholder="Digite o nome" required>

        <br><br>

        <label for="preco">Preço:</label>
        <input type="number" id="preco" placeholder="Digite o preço" min="0" step="0.01" required>

        <br><br>

        <label for="quantidade">Quantidade:</label>
        <input type="number" id="quantidade" placeholder="Digite a quantidade" min="0" step="1" required>

        <br><br>

        <button type="submit">Cadastrar</button>
    </form>

</body>
</html>
